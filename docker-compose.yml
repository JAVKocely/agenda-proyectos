version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: agenda_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agenda_user
      POSTGRES_PASSWORD: agenda_password
      POSTGRES_DB: agenda_proyectos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda_user -d agenda_proyectos"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agenda_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://agenda_user:agenda_password@postgres:5432/agenda_proyectos
      - ENVIRONMENT=production
      - AI_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-2.5-flash
    ports:
      - "8000:8000"

volumes:
  postgres_data:
